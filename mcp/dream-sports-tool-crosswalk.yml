summary: >-
  Dream Sports' MCP surface and its OpenAPI surface do not overlap. The one first-party MCP server
  (odin-mcp) fronts the Odin developer platform — odin-deployer-ent, odin-scout-ent and user-auth —
  none of which publishes an OpenAPI document, so no MCP tool can be bound to an operationId. What
  the provider does publish for the Odin surface is protobuf: every one of the 17 gRPC-backed tools
  binds to a real, verified rpc in the saved .proto files, which is the strongest available contract
  for those tools. Conversely, all 254 operations across the five published OpenAPIs (Guardian,
  Checkmate, Raven/Thunder, Delivr, DOTA) have no MCP tool at all. This is a genuine surface
  divergence, recorded rather than papered over.
