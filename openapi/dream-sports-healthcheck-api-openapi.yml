openapi: 3.2.0
info:
  title: Dream Sports Healthcheck API
  version: 1.0.0
  description: 'Operations tagged Healthcheck across 2 of this provider''s published API definitions: dream-sports-thunder-admin-openapi.yml, dream-sports-thunder-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:8081
  description: Thunder Admin Server (Management endpoints)
- url: http://localhost:8080
  description: Thunder API Server (SDK & Debug endpoints)
tags:
- name: Healthcheck
paths:
  /healthcheck:
    servers:
    - url: http://localhost:8081
      description: Thunder Admin Server (Management endpoints)
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
      tags:
      - Healthcheck
  /healthcheck/ping:
    servers:
    - url: http://localhost:8081
      description: Thunder Admin Server (Management endpoints)
    get:
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
      tags:
      - Healthcheck
components:
  schemas:
    JsonObject:
      type: array
      items: {}
x-refined-from:
- dream-sports-thunder-admin-openapi.yml
- dream-sports-thunder-api-openapi.yml
