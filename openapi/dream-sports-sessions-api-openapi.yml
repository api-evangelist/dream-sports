openapi: 3.2.0
info:
  title: Delivr OTA Server Sessions API
  description: 'Delivr OTA Server API enables developers to deploy mobile app updates (JavaScript, assets, etc.)

    directly to end users'' devices without going through app store review processes.


    ## Features

    - Deploy over-the-air updates to React Native applications

    - Manage apps, deployments, and releases

    - Gradual rollouts and A/B testing

    - Rollback capabilities

    - Deployment metrics and analytics

    - Multi-platform support'
tags:
- name: Sessions
paths:
  /sessions/{createdBy}:
    delete:
      tags:
      - Sessions
      summary: Delete sessions
      description: Removes all sessions created by a specific machine/client
      parameters:
      - name: createdBy
        in: path
        required: true
        schema:
          type: string
        description: Machine name or identifier that created the sessions
      responses:
        '204':
          description: Sessions deleted
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: deleteSessionsByCreatedBy
      x-operation-id-source: derived
components:
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AccessKey
      description: Access key or session token obtained from OAuth authentication
