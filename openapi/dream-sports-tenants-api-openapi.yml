openapi: 3.2.0
info:
  title: Delivr OTA Server Tenants API
  description: 'Delivr OTA Server API enables developers to deploy mobile app updates (JavaScript, assets, etc.)

    directly to end users'' devices without going through app store review processes.


    ## Features

    - Deploy over-the-air updates to React Native applications

    - Manage apps, deployments, and releases

    - Gradual rollouts and A/B testing

    - Rollback capabilities

    - Deployment metrics and analytics

    - Multi-platform support'
tags:
- name: Tenants
paths:
  /tenants:
    get:
      tags:
      - Tenants
      summary: List organizations
      description: Returns all organizations/tenants for the authenticated account
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  organisations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
      operationId: getTenants
      x-operation-id-source: derived
  /tenants/{tenantId}:
    delete:
      tags:
      - Tenants
      summary: Remove organization
      description: Removes an organization/tenant from the account
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
        description: Organization/tenant ID
      responses:
        '201':
          description: Organization deleted
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: deleteTenantsByTenantId
      x-operation-id-source: derived
components:
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Organization:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        createdBy:
          type: string
        createdTime:
          type: integer
          format: int64
        role:
          type: string
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AccessKey
      description: Access key or session token obtained from OAuth authentication
