openapi: 3.2.0
info:
  title: Delivr OTA Server Collaborators API
  description: 'Delivr OTA Server API enables developers to deploy mobile app updates (JavaScript, assets, etc.)

    directly to end users'' devices without going through app store review processes.


    ## Features

    - Deploy over-the-air updates to React Native applications

    - Manage apps, deployments, and releases

    - Gradual rollouts and A/B testing

    - Rollback capabilities

    - Deployment metrics and analytics

    - Multi-platform support'
tags:
- name: Collaborators
paths:
  /apps/{appName}/collaborators:
    get:
      tags:
      - Collaborators
      summary: List collaborators
      description: Returns all collaborators for an app
      parameters:
      - $ref: '#/components/parameters/AppName'
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: List of collaborators
          content:
            application/json:
              schema:
                type: object
                properties:
                  collaborators:
                    $ref: '#/components/schemas/CollaboratorMap'
      operationId: getAppsByAppNameCollaborators
      x-operation-id-source: derived
  /apps/{appName}/collaborators/{email}:
    post:
      tags:
      - Collaborators
      summary: Add collaborator
      description: Adds a collaborator to the app (requires Owner permission)
      parameters:
      - $ref: '#/components/parameters/AppName'
      - name: email
        in: path
        required: true
        schema:
          type: string
          format: email
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '201':
          description: Collaborator added
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: postAppsByAppNameCollaboratorsByEmail
      x-operation-id-source: derived
    patch:
      tags:
      - Collaborators
      summary: Update collaborator role
      description: Updates a collaborator's role (requires Owner permission)
      parameters:
      - $ref: '#/components/parameters/AppName'
      - name: email
        in: path
        required: true
        schema:
          type: string
          format: email
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                  - Owner
                  - Collaborator
      responses:
        '200':
          description: Collaborator role updated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: patchAppsByAppNameCollaboratorsByEmail
      x-operation-id-source: derived
    delete:
      tags:
      - Collaborators
      summary: Remove collaborator
      description: Removes a collaborator from the app (requires Owner permission, or user can remove themselves)
      parameters:
      - $ref: '#/components/parameters/AppName'
      - name: email
        in: path
        required: true
        schema:
          type: string
          format: email
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '201':
          description: Collaborator removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: deleteAppsByAppNameCollaboratorsByEmail
      x-operation-id-source: derived
components:
  parameters:
    AppName:
      name: appName
      in: path
      required: true
      schema:
        type: string
      description: Application name (or 'owner:appName' for disambiguation)
      example: MyApp-iOS
    TenantHeader:
      name: tenant
      in: header
      schema:
        type: string
      description: Organization/tenant ID filter
  schemas:
    CollaboratorProperties:
      type: object
      properties:
        permission:
          type: string
          enum:
          - Owner
          - Collaborator
        isCurrentAccount:
          type: boolean
          description: Whether this is the authenticated user
    CollaboratorMap:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/CollaboratorProperties'
      example:
        user@example.com:
          permission: Owner
          isCurrentAccount: true
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
  responses:
    BadRequest:
      description: Bad request - invalid parameters
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - type: array
              items:
                type: object
                properties:
                  message:
                    type: string
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AccessKey
      description: Access key or session token obtained from OAuth authentication
