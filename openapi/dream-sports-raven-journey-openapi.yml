openapi: 3.0.3
info:
  title: Raven Journey API
  description: |
    Journey module APIs for Journey management, behaviour tags, events, and SDK operations.

    ## Authentication
    TENANT-ID and PROJECT-ID headers are required on all endpoints (auth routes use TENANT-ID only) via the global `TenantIdHeader` security scheme.
    The `/healthcheck` endpoint is exempted. Some endpoints also require `USER-ID`.

    ## Timestamps
    All timestamps are in milliseconds since Unix epoch. Use future timestamps (e.g., 2082758400000 = Jan 1, 2036).
  version: 1.0.0
  contact:
    name: Raven Team

servers:
  - url: http://localhost:8080
    description: Local development server

security:
  - TenantIdHeader: []

tags:
  - name: Health
    description: Health check endpoints
  - name: Journeys
    description: Journey management operations — create, read, update, and delete journeys
  - name: Journey Lifecycle
    description: |
      Journey lifecycle status transitions.
      Journeys move through states: DRAFT -> SCHEDULED -> LIVE -> PAUSED -> CONCLUDED/TERMINATED.
      Each status transition has its own dedicated endpoint.
  - name: Journey Test
    description: Test journey operations — create and remove test journeys for validating behaviour before going live
  - name: Journey Behaviour
    description: Journey behaviour tag management — define and manage behaviour tags linked to journeys
  - name: Events Catalog
    description: Event schema management — create, update, and manage event definitions and their properties
  - name: Nudge Preview
    description: Nudge preview management — create, update, and retrieve nudge preview templates with TTL configuration
  - name: Client SDK
    description: Client SDK operations — endpoints consumed by the SDK for active journeys and state machine snapshots
  - name: Auth
    description: Authentication operations — Google login and token refresh
  - name: Console Users
    description: Console user management via Firebase Admin SDK
  - name: Admin - Console Users
    description: |
      Admin-only console user operations — user onboarding and updates that include project IDs
      (stored in Firebase custom claims). Requires appropriate admin authorization at the gateway.

paths:
  /healthcheck:
    get:
      tags:
        - Health
      summary: Health Check
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /thunder/filters/:
    get:
      tags:
        - Journeys
      summary: Get Filter Options
      description: Returns available filter options for journey listing
      operationId: getFilters
      responses:
        '200':
          description: Filter options retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /thunder/ctas:
    get:
      tags:
        - Journeys
      summary: List Journeys
      description: Retrieves a paginated list of journeys
      operationId: listJourneys
      parameters:
        - name: pageNumber
          in: query
          schema:
            type: integer
            default: 0
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          description: Filter by journey status
          schema:
            type: string
            enum: [DRAFT, SCHEDULED, LIVE, PAUSED, CONCLUDED, TERMINATED]
        - name: team
          in: query
          schema:
            type: string
        - name: tags
          in: query
          schema:
            type: string
        - name: searchName
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Journeys retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Journeys
      summary: Create Journey
      description: |
        Creates a new journey in DRAFT status.

        **Important**:
        - `startTime` and `endTime` must be future timestamps (milliseconds)
        - `stateMachineTTL` must be a future timestamp
        - Use `cohortEligibility: { includes: ["all"], excludes: [] }`
      operationId: createJourney
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyRequest'
            example:
              name: "Welcome Notification"
              tags: ["growth", "notifications"]
              description: "Welcome nudge for new users"
              team: "marketing"
              startTime: 2082758400000
              endTime: 2114294400000
              rule:
                cohortEligibility:
                  includes: ["all"]
                  excludes: []
                stateToAction:
                  "1": "actionId1"
                contextParams: ["mode"]
                stateTransition:
                  AppLaunch:
                    "0":
                      - transitionTo: "1"
                        filters:
                          operator: "AND"
                          filter: []
                priority: 1
                stateMachineTTL: 2082758400000
                actions:
                  - actionId1:
                      type: "BottomSheet"
                      nudgeId: "5"
                frequency:
                  session:
                    limit: 1
                  window:
                    limit: 1
                    unit: "days"
                    value: 2
      responses:
        '200':
          description: Journey created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                data: 12345
                statusCode: 200
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /thunder/ctas/{ctaId}:
    get:
      tags:
        - Journeys
      summary: Get Journey by ID
      operationId: getJourney
      parameters:
        - name: ctaId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Journey retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Journey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Journeys
      summary: Update Journey
      operationId: updateJourney
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: ctaId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyUpdateRequest'
            example:
              tags: ["growth", "updated"]
              description: "Updated description"
              team: "marketing"
              startTime: 2082758400000
              endTime: 2114294400000
              rule:
                cohortEligibility:
                  includes: ["all"]
                  excludes: []
                stateToAction:
                  "1": "actionId1"
                contextParams: ["mode"]
                stateTransition:
                  AppLaunch:
                    "0":
                      - transitionTo: "1"
                        filters:
                          operator: "AND"
                          filter: []
                priority: 1
                stateMachineTTL: 2082758400000
                actions:
                  - actionId1:
                      type: "BottomSheet"
                      nudgeId: "5"
                frequency:
                  session:
                    limit: 1
                  window:
                    limit: 1
                    unit: "days"
                    value: 2
      responses:
        '200':
          description: Journey updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Journey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /thunder/ctas/{id}/live:
    put:
      tags:
        - Journey Lifecycle
      summary: Activate Journey
      description: Changes the journey status to LIVE. The journey must be in SCHEDULED or PAUSED status.
      operationId: activateJourney
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 12345
      responses:
        '200':
          description: Journey activated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Journey cannot be activated from current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Journey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /thunder/ctas/{id}/pause:
    put:
      tags:
        - Journey Lifecycle
      summary: Pause Journey
      description: Changes the journey status to PAUSED. The journey must be in LIVE status.
      operationId: pauseJourney
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 12345
      responses:
        '200':
          description: Journey paused successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Journey cannot be paused from current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Journey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /thunder/ctas/{id}/schedule:
    put:
      tags:
        - Journey Lifecycle
      summary: Schedule Journey
      description: Changes the journey status to SCHEDULED. The journey must be in DRAFT status.
      operationId: scheduleJourney
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 12345
      responses:
        '200':
          description: Journey scheduled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Journey cannot be scheduled from current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Journey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /thunder/ctas/{id}/conclude:
    put:
      tags:
        - Journey Lifecycle
      summary: Conclude Journey
      description: Changes the journey status to CONCLUDED. The journey must be in LIVE or PAUSED status.
      operationId: concludeJourney
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 12345
      responses:
        '200':
          description: Journey concluded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Journey cannot be concluded from current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Journey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /thunder/ctas/{id}/terminate:
    put:
      tags:
        - Journey Lifecycle
      summary: Terminate Journey
      description: Changes the journey status to TERMINATED. The journey must be in DRAFT, SCHEDULED, LIVE, or PAUSED status.
      operationId: terminateJourney
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 12345
      responses:
        '200':
          description: Journey terminated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Journey cannot be terminated from current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Journey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /thunder/ctas/test/create:
    post:
      tags:
        - Journey Test
      summary: Create Test Journey
      description: Creates a test journey for specific users. If previousCtaId is provided, the old test journey is deleted first.
      operationId: createTestJourney
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestJourneyRequest'
            example:
              rule:
                cohortEligibility:
                  includes: ["all"]
                  excludes: []
              previousCtaId: null
              expiresInMinutes: 30
              userIds: [123456, 789012]
      responses:
        '201':
          description: Test journey created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /thunder/ctas/test/{ctaId}:
    delete:
      tags:
        - Journey Test
      summary: Remove Test Journey
      description: Deletes a test journey by its ID.
      operationId: removeTestJourney
      parameters:
        - name: ctaId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 12345
      responses:
        '200':
          description: Test journey removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Test journey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /thunder/behaviour-tags/:
    get:
      tags:
        - Journey Behaviour
      summary: List Behaviour Tags
      operationId: listBehaviourTags
      responses:
        '200':
          description: Behaviour tags retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Journey Behaviour
      summary: Create Behaviour Tag
      operationId: createBehaviourTag
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BehaviourTagRequest'
            example:
              behaviourTagName: "first_purchase"
              description: "Tag for users who made first purchase"
              exposureRule:
                session:
                  limit: 1
                window:
                  limit: 3
                  unit: "days"
                  value: 7
                lifespan:
                  limit: 10
              linkedCtas: []
      responses:
        '200':
          description: Behaviour tag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /thunder/behaviour-tags/{behaviourTagName}:
    get:
      tags:
        - Journey Behaviour
      summary: Get Behaviour Tag
      operationId: getBehaviourTag
      parameters:
        - name: behaviourTagName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Behaviour tag retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Behaviour tag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Journey Behaviour
      summary: Update Behaviour Tag
      operationId: updateBehaviourTag
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: behaviourTagName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BehaviourTagUpdateRequest'
            example:
              description: "Updated description"
              exposureRule:
                session:
                  limit: 2
                window:
                  limit: 5
                  unit: "days"
                  value: 7
                lifespan:
                  limit: 20
              linkedCtas: []
      responses:
        '200':
          description: Behaviour tag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Behaviour tag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Journey Behaviour
      summary: Delete Behaviour Tag
      operationId: deleteBehaviourTag
      parameters:
        - name: behaviourTagName
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Behaviour tag deleted
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Behaviour tag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /thunder/events:
    get:
      tags:
        - Events Catalog
      summary: List Events
      operationId: listEvents
      responses:
        '200':
          description: Events retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Events Catalog
      summary: Create or Update Events
      description: |
        Creates new events or updates existing events. Accepts an array of EventInput objects.
        Each event includes a name and a list of properties with types, expected values, and mandatory flags.
      operationId: upsertEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/EventInput'
            example:
              - eventName: "AppLaunch"
                properties:
                  - propertyName: "mode"
                    type: "string"
                    isMandatory: true
                    description: "App launch mode"
      responses:
        '200':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /thunder/events/list/names:
    get:
      tags:
        - Events Catalog
      summary: Get All Event Names
      description: Retrieves a list of all event names for the project (lightweight, no property details).
      operationId: getAllEventNames
      responses:
        '200':
          description: Event names retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /thunder/events/{event-name}:
    get:
      tags:
        - Events Catalog
      summary: Get Event by Name
      description: Retrieves a specific event by its name, including all property definitions.
      operationId: getEvent
      parameters:
        - name: event-name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Events Catalog
      summary: Update Event Properties
      description: Updates the properties of an existing event.
      operationId: patchEvent
      parameters:
        - name: event-name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/EventInput'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Events Catalog
      summary: Delete Event
      operationId: deleteEvent
      parameters:
        - name: event-name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Event deleted
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /thunder/nudge/preview/:
    post:
      tags:
        - Nudge Preview
      summary: Create or Update Nudge Preview
      description: |
        Creates a new nudge preview or updates an existing one. Nudge previews store UI templates
        with a TTL (time-to-live) that controls how long the preview is available.
      operationId: createOrUpdateNudgePreview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NudgePreview'
            example:
              id: "preview_001"
              template: '{"type":"BottomSheet","testId":"nudge_container_bottom_sheet"}'
              ttl: 3600
      responses:
        '200':
          description: Nudge preview created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid request — id or template is empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
