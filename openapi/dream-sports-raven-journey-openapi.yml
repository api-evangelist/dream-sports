              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Downstream timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/admin/console-users/onboard:
    post:
      tags:
        - Admin - Console Users
      summary: Onboard console user (admin)
      description: |
        Creates the user in Firebase, optionally sets validated project IDs on the user (Firebase),
        and records email-to-tenant mapping in Postgres. Project IDs must belong to the tenant.
      operationId: adminOnboardConsoleUser
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsoleUserOnboardRequest'
      responses:
        '201':
          description: Console user onboarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleUserIdApiResponse'
        '400':
          description: Invalid request or project IDs not valid for tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Downstream failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Downstream timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/admin/console-users/uid/{uid}:
    patch:
      tags:
        - Admin - Console Users
      summary: Update console user by uid (admin, includes projectIds)
      description: |
        Same profile fields as the standard PATCH, plus optional projectIds for Firebase custom claims.
        Omit projectIds to leave them unchanged; pass an empty array to clear them.
      operationId: adminUpdateConsoleUserByUid
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: uid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminConsoleUserUpdateRequest'
      responses:
        '204':
          description: Console user updated
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Downstream failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Downstream timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/admin/console-users/email/{email}:
    patch:
      tags:
        - Admin - Console Users
      summary: Update console user by email (admin, includes projectIds)
      description: |
        Same as admin update by uid; resolves user by email first.
      operationId: adminUpdateConsoleUserByEmail
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: email
          in: path
          required: true
          description: URL-encoded email value
          schema:
            type: string
            format: email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminConsoleUserUpdateRequest'
      responses:
        '204':
          description: Console user updated
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: PROJECT-ID or TENANT-ID header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Downstream failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Downstream timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    UserId:
      name: USER-ID
      in: header
      required: true
      schema:
        type: string
      example: admin

    SdkUserId:
      name: user-id
      in: header
      required: true
      schema:
        type: integer
        format: int64
      example: 135162489

    SdkPlatform:
      name: platform
      in: header
      required: true
      schema:
        type: string
        enum:
          - android-mobile
          - android-tv
          - ios
          - tvos
      example: android-mobile

    SdkFramework:
      name: framework
      in: header
      required: true
      schema:
        type: string
        enum:
          - native
          - react-native
          - flutter
      example: react-native

    SdkVersion:
      name: sdk-version
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'
      example: 1.5.0

    SdkPackage:
      name: package
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{3,128}$'
      example: com.dream11.app

    SdkAppVersion:
      name: app-version
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'
      description: Conventional app version. CodePush suffix is allowed (e.g., 25.2.0.v1).
      example: 25.2.0

    SdkAppBuild:
      name: app-build
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'
      example: 250200123

    SdkOs:
      name: os
      in: header
      required: true
      schema:
        type: string
        enum:
          - android
          - ios
          - tvos
      example: android

    SdkOsVersion:
      name: os-version
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,32}$'
      example: "14"

    SdkOsApiLevel:
      name: os-api-level
      in: header
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 34

  securitySchemes:
    TenantIdHeader:
      type: apiKey
      in: header
      name: TENANT-ID

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        statusCode:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            cause:
              type: string
            code:
              type: string

    AuthLoginRequest:
      type: object
      required:
        - google_id_token
      properties:
        google_id_token:
          type: string
          description: Raw Google ID token (JWT)
          example: "{{GOOGLE_ID_TOKEN_RAW}}"

    AuthRefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Raw Firebase refresh token
          example: "{{FIREBASE_REFRESH_TOKEN_RAW}}"

    AuthTokenData:
      type: object
      properties:
        access_token:
          type: string
          description: Raw Firebase ID token (JWT)
          example: "{{FIREBASE_ID_TOKEN_RAW}}"
        refresh_token:
          type: string
          description: Raw Firebase refresh token
          example: "{{FIREBASE_REFRESH_TOKEN_RAW}}"
        expires_in:
          type: integer
          format: int64
          example: 3600
        token_type:
          type: string
          example: "Bearer"

    AuthTokenApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/AuthTokenData'

    ConsoleUserCreateRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
        photoUrl:
          type: string
        emailVerified:
          type: boolean
        disabled:
          type: boolean

    ConsoleUserUpdateRequest:
      type: object
      description: Profile fields only (no projectIds). Use admin update to change project IDs.
      properties:
        displayName:
          type: string
        photoUrl:
          type: string
        emailVerified:
          type: boolean
        disabled:
          type: boolean

    ConsoleUserOnboardRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        projectIds:
          type: array
          items:
            type: string
          description: Optional; must be a subset of the tenant's projects when non-empty.

    AdminConsoleUserUpdateRequest:
      type: object
      properties:
        displayName:
          type: string
        photoUrl:
          type: string
        emailVerified:
          type: boolean
        disabled:
          type: boolean
        projectIds:
          type: array
          items:
            type: string
          description: |
            Optional. When set, replaces Firebase custom-claim project IDs. Empty array clears them.
            When omitted, existing project IDs are unchanged.

    ConsoleUserRecord:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        photoUrl:
          type: string
        emailVerified:
          type: boolean
        disabled:
          type: boolean
        projectIds:
          type: array
          items:
            type: string
          description: Project IDs from Firebase custom claims (allowedProjectIds). Omitted or empty when none set.
        createdAt:
          type: string
          format: date-time
          nullable: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        lastRefreshAt:
          type: string
          format: date-time
          nullable: true

    ConsoleUserPagination:
      type: object
      properties:
        pageSize:
          type: integer
        recordCount:
          type: integer
          nullable: true
          description: Total matching records. Present only when id/email filters are used.
        nextPageToken:
          type: string
          nullable: true
          description: Cursor for fetching the next page. Null when there are no more results.

    ConsoleUserListData:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/ConsoleUserRecord'
        pagination:
          $ref: '#/components/schemas/ConsoleUserPagination'

    ConsoleUserIdData:
      type: object
      properties:
        id:
          type: string

    ConsoleUserListApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/ConsoleUserListData'

    ConsoleUserRecordApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/ConsoleUserRecord'

    ConsoleUserIdApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/ConsoleUserIdData'

    JourneyRequest:
      type: object
      required:
        - name
        - team
        - rule
      properties:
        name:
          type: string
        tags:
          type: array
          items:
            type: string
        description:
          type: string
        team:
          type: string
        startTime:
          type: integer
          format: int64
          description: Future epoch timestamp in milliseconds
        endTime:
          type: integer
          format: int64
          description: Future epoch timestamp in milliseconds
        rule:
          $ref: '#/components/schemas/RuleRequest'

    JourneyUpdateRequest:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
        description:
          type: string
        team:
          type: string
        startTime:
          type: integer
          format: int64
        endTime:
          type: integer
          format: int64
        rule:
          $ref: '#/components/schemas/RuleRequest'

    RuleRequest:
      type: object
      required:
        - cohortEligibility
        - stateToAction
        - stateTransition
        - priority
        - stateMachineTTL
        - actions
        - frequency
      properties:
        cohortEligibility:
          type: object
          properties:
            includes:
              type: array
              items:
                type: string
            excludes:
              type: array
              items:
                type: string
        stateToAction:
          type: object
          additionalProperties:
            type: string
        resetStates:
          type: array
          items:
            type: string
        contextParams:
          type: array
          items:
            type: string
        stateTransition:
          type: object
        groupByConfig:
          type: object
        priority:
          type: integer
        stateMachineTTL:
          type: integer
          format: int64
          description: Future epoch timestamp in milliseconds
        actions:
          type: array
          items:
            type: object
        frequency:
          type: object
          properties:
            session:
              type: object
              properties:
                limit:
                  type: integer
            window:
              type: object
              properties:
                limit:
                  type: integer
                unit:
                  type: string
                value:
                  type: integer

    BehaviourTagRequest:
      type: object
      required:
        - behaviourTagName
      properties:
        behaviourTagName:
          type: string
        description:
          type: string
        exposureRule:
          type: object
          properties:
            session:
              type: object
              properties:
                limit:
                  type: integer
            window:
              type: object
              properties:
                limit:
                  type: integer
                unit:
                  type: string
                value:
                  type: integer
            lifespan:
              type: object
              properties:
                limit:
                  type: integer
        linkedCtas:
          type: array
          items:
            type: string

    BehaviourTagUpdateRequest:
      type: object
      properties:
        description:
          type: string
        exposureRule:
          type: object
        linkedCtas:
          type: array
          items:
            type: string

    EventInput:
      type: object
      required:
        - eventName
        - properties
      properties:
        eventName:
          type: string
        properties:
          type: array
          items:
            $ref: '#/components/schemas/EventPropertyInput'

    EventPropertyInput:
      type: object
      required:
        - propertyName
        - type
        - isMandatory
      properties:
        propertyName:
          type: string
        type:
          type: string
        expectedValue:
          type: string
        isMandatory:
          type: boolean
        description:
          type: string

    NudgePreview:
      type: object
      required:
        - id
        - template
      properties:
        id:
          type: string
          description: Unique identifier for the nudge preview
        template:
          type: string
          description: JSON string containing the nudge UI template configuration
        projectId:
          type: string
          description: Project identifier (set by server)
        ttl:
          type: integer
          format: int32
          description: Time-to-live in seconds for the preview record (default 3600)

    TestJourneyRequest:
      type: object
      description: Request to create a test journey for validating journey behaviour before going live
      properties:
        userIds:
          type: array
          items:
            type: string
          description: List of user IDs to test the journey with

    JourneySnapshotRequest:
      type: object
      properties:
        ctas:
          type: array
          items:
            type: object
        behaviourTags:
          type: array
          items:
            type: object

    SdkUserProfileLoginRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        birthdate:
          type: string
        gender:
          type: string
        city:
          type: string
        locality:
          type: string
        postalCode:
          type: string
        country:
          type: string
        language:
          type: string
        timezone:
          type: string
        custom:
          type: object
          additionalProperties: true

    SdkTokenRegisterRequest:
      type: object
      required:
        - userId
        - token
        - deviceId
        - tokenType
      properties:
        userId:
          type: string
        token:
          type: string
        deviceId:
          type: string
        tokenType:
          type: string
          enum:
            - FCM
            - APNS
        os:
          type: string
        osVersion:
          type: string
        appPackageName:
          type: string
        appVersion:
          type: string

    PreferenceItem:
      type: object
      required:
        - channel
        - subcategory
        - value
      properties:
        channel:
          type: string
        subcategory:
          type: string
        value:
          type: boolean

    SdkUpsertPreferencesRequest:
      type: object
      required:
        - userId
        - items
      properties:
        userId:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PreferenceItem'

    SdkUpsertPreferencesResponse:
      type: object
      properties:
        updated:
          type: integer
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/PreferenceItem'

    SdkUpsertPreferencesApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/SdkUpsertPreferencesResponse'
