  /v1/auth/google-login:
    post:
      tags:
        - Auth
      summary: Google login
      operationId: googleLogin
      description: |
        Login flow (no signInWithIdp):
        1) Verify Google ID token with Google tokeninfo.
        2) Validate issuer/audience/expiry/email_verified.
           - If auth.googleAllowedAudience is configured, aud must match it.
        3) Resolve existing Firebase user by google sub (provider mapping).
        4) If not found, fallback to email lookup.
           - If google provider already exists on email match -> fail.
           - If google provider missing -> link google.com provider with verified sub.
        5) Mint custom token and exchange via signInWithCustomToken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
            example:
              google_id_token: "{{GOOGLE_ID_TOKEN_RAW}}"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenApiResponse'
              example:
                success: true
                data:
                  access_token: "{{FIREBASE_ID_TOKEN_RAW}}"
                  refresh_token: "{{FIREBASE_REFRESH_TOKEN_RAW}}"
                  expires_in: 3600
                  token_type: "Bearer"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials or TENANT-ID header is missing/invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User not onboarded for tenant or email-matched user already linked to Google provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Authentication downstream failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/refresh:
    post:
      tags:
