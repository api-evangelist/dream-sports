openapi: 3.2.0
info:
  title: Delivr OTA Server Apps API
  description: 'Delivr OTA Server API enables developers to deploy mobile app updates (JavaScript, assets, etc.)

    directly to end users'' devices without going through app store review processes.


    ## Features

    - Deploy over-the-air updates to React Native applications

    - Manage apps, deployments, and releases

    - Gradual rollouts and A/B testing

    - Rollback capabilities

    - Deployment metrics and analytics

    - Multi-platform support'
tags:
- name: Apps
paths:
  /apps:
    get:
      tags:
      - Apps
      summary: List apps
      description: Returns all apps accessible by the authenticated account
      parameters:
      - name: tenant
        in: header
        schema:
          type: string
        description: Filter apps by tenant/organization ID
      responses:
        '200':
          description: List of apps
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    items:
                      $ref: '#/components/schemas/App'
      operationId: getApps
      x-operation-id-source: derived
    post:
      tags:
      - Apps
      summary: Create app
      description: Creates a new application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app:
                  $ref: '#/components/schemas/AppCreationRequest'
      responses:
        '201':
          description: App created
          headers:
            Location:
              schema:
                type: string
              description: URL of the created app
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    $ref: '#/components/schemas/App'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: postApps
      x-operation-id-source: derived
  /apps/{appName}:
    get:
      tags:
      - Apps
      summary: Get app
      description: Returns details of a specific app
      parameters:
      - $ref: '#/components/parameters/AppName'
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: App details
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    $ref: '#/components/schemas/App'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getAppsByAppName
      x-operation-id-source: derived
    patch:
      tags:
      - Apps
      summary: Update app
      description: Updates app properties (requires Owner permission)
      parameters:
      - $ref: '#/components/parameters/AppName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app:
                  type: object
                  properties:
                    name:
                      type: string
                      description: New app name
      responses:
        '200':
          description: App updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    $ref: '#/components/schemas/App'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: patchAppsByAppName
      x-operation-id-source: derived
    delete:
      tags:
      - Apps
      summary: Delete app
      description: Removes an app and all its deployments (requires Owner permission)
      parameters:
      - $ref: '#/components/parameters/AppName'
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '201':
          description: App deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: deleteAppsByAppName
      x-operation-id-source: derived
  /apps/{appName}/transfer/{email}:
    post:
      tags:
      - Apps
      summary: Transfer app ownership
      description: Transfers app ownership to another user (requires Owner permission)
      parameters:
      - $ref: '#/components/parameters/AppName'
      - name: email
        in: path
        required: true
        schema:
          type: string
          format: email
        description: Email of the new owner
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '201':
          description: App ownership transferred
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: postAppsByAppNameTransferByEmail
      x-operation-id-source: derived
components:
  parameters:
    AppName:
      name: appName
      in: path
      required: true
      schema:
        type: string
      description: Application name (or 'owner:appName' for disambiguation)
      example: MyApp-iOS
    TenantHeader:
      name: tenant
      in: header
      schema:
        type: string
      description: Organization/tenant ID filter
  schemas:
    CollaboratorProperties:
      type: object
      properties:
        permission:
          type: string
          enum:
          - Owner
          - Collaborator
        isCurrentAccount:
          type: boolean
          description: Whether this is the authenticated user
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
    CollaboratorMap:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/CollaboratorProperties'
      example:
        user@example.com:
          permission: Owner
          isCurrentAccount: true
    App:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          example: MyApp-iOS
        collaborators:
          $ref: '#/components/schemas/CollaboratorMap'
        deployments:
          type: array
          items:
            type: string
          example:
          - Production
          - Staging
        organisation:
          type: object
          properties:
            orgId:
              type: string
            orgName:
              type: string
    AppCreationRequest:
      allOf:
      - $ref: '#/components/schemas/App'
      - type: object
        properties:
          manuallyProvisionDeployments:
            type: boolean
            default: false
            description: If true, does not create default Production/Staging deployments
  responses:
    BadRequest:
      description: Bad request - invalid parameters
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - type: array
              items:
                type: object
                properties:
                  message:
                    type: string
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict - resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AccessKey
      description: Access key or session token obtained from OAuth authentication
