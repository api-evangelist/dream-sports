note: >-
  The mechanical derivation from openapi/ produced nothing — none of the eight published Dream Sports
  specifications declares an oauth2 securityScheme, so there are no scopes in-spec. The real scope
  surface is live: the "Login with Dream11" issuer publishes an OpenID Connect discovery document
  listing scopes_supported and claims_supported, and the Guardian OpenAPI exposes scope
  administration endpoints (GET/POST /scopes, PUT/DELETE /scopes/{name}, and per-client scope
  assignment at /v1/admin/client/{client_id}/scope) so a self-hosted deployment defines its own set.
  The scopes below are the ones the Dream11 production issuer actually advertises.
