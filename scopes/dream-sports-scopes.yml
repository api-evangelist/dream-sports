scope_administration:
  note: >-
    Guardian (the open-source engine) lets an operator define scopes per tenant rather than shipping a
    fixed catalogue.
  operations:
  - 'GET /scopes — list scopes'
  - 'POST /scopes — create a scope'
  - 'PUT /scopes/{name} — update a scope'
  - 'DELETE /scopes/{name} — delete a scope'
  - 'POST /v1/admin/client/{client_id}/scope — assign scopes to a client'
  - 'GET /v1/admin/client/{client_id}/scope — list a client''s scopes'
  - 'DELETE /v1/admin/client/{client_id}/scope — unassign a scope (idempotent: succeeds if not assigned)'
  source: openapi/dream-sports-guardian-openapi.yml
