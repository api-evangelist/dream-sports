method: searched
source: >-
  npm registry search + registry metadata for the @d11 scope (publisher "dreamsportslabs"),
  luarocks.org/modules/dream11, and the dream11 / dream-horizon-org / ds-horizon / dream-sports-labs
  GitHub organizations
notes: >-
  Dream Sports does not publish a consumer/product API SDK — there is no public Dream11 or FanCode
  developer API to write a client for. What it does publish is first-party client libraries and
  platform components from the Dream Horizon (HorizonOS) open-source initiative: React Native SDKs,
  the "Login with Dream11" auth SDKs that speak to the auth.dream11.com OIDC surface, a Delivr OTA
  CLI, and Kong/Lua gateway plugins on LuaRocks. official:true is set only where the publishing
  account or repository is demonstrably a Dream Sports account (npm publisher "dreamsportslabs" /
  scope @d11, or a repo under github.com/dream11, /dream-horizon-org, /ds-horizon, /dream-sports-labs).
