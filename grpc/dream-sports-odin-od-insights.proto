syntax = "proto3";
package dream11.od.insights.v1;

option java_multiple_files = true;
option java_package = "com.dream11.odin.grpc.insights";

service InsightsService {
  rpc GetPlatformInsights(GetPlatformInsightsRequest) returns (GetPlatformInsightsResponse) {}
}

message GetPlatformInsightsRequest {
  optional string tier = 1;
  optional string environment_name = 2;
  int32 lookback_days = 3;
  optional string start_date = 4;
  optional string end_date = 5;
}

message GetPlatformInsightsResponse {
  int32 environment_count = 1;
  int32 deployment_count = 2;
  double success_rate = 3;
  double change_failure_rate = 4;

  repeated WeeklyMetric deployment_frequency = 5;
  repeated WeeklyMetric success_rate_series = 6;

  repeated string available_tiers = 7;
  repeated string available_environments = 8;

  // Platform Adoption
  int32 services_deployed = 9;
  int32 component_instances = 10;
  double avg_components_per_service = 11;
  int32 teams_on_platform = 12;
  // Latest component_task per (env, service, component) with release_agent_enabled = true.
  int32 agent_enabled_components = 13;

  // Team Activity
  repeated TeamActivity team_activity = 14;

  // Release Agent
  int32 agent_managed_deploys = 15;
  int32 manual_deploys = 16;
  double canary_success_rate = 17;
  int32 auto_rollbacks = 18;
}

message WeeklyMetric {
  string week_label = 1;
  double value = 2;
}

message TeamActivity {
  string team = 1;
  int32 deploys = 2;
  int32 failures = 3;
  double success_rate = 4;
}
