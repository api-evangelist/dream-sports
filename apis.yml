aid: dream-sports
name: Dream Sports
description: >-
  Dream Sports is India's largest sports technology company, founded by Harsh Jain and Bhavit Sheth, whose consumer
  brands include Dream11 (fantasy sports), FanCode (sports content, streaming and commerce), DreamSetGo (sports travel
  and experiences), Dream Cricket, Dream Money and DreamStreet, alongside the Dream Sports Foundation. Its public
  machine-readable API surface is not a consumer product API but two engineering surfaces: the "Login with Dream11"
  OpenID Connect identity service at auth.dream11.com, which publishes an OIDC discovery document, and Dream Horizon
  (also branded HorizonOS) — the company's open-source initiative that releases the platform engineering stack built
  to run Dream11 at 250M+ users. Dream Horizon publishes real OpenAPI 3.x specifications for Guardian (authentication
  and authorization), Checkmate (test management), Raven and Raven Thunder (in-app messaging and journeys), Delivr and
  DOTA (over-the-air mobile updates), protobuf service definitions for Odin (its internal developer platform), a
  first-party stdio MCP server for Odin, an llms.txt, and client SDKs published to npm under the @d11 scope and to
  LuaRocks under the dream11 namespace.
