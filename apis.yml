apis:
- name: Odin MCP Server
  description: >-
    First-party Model Context Protocol server (stdio transport) published by Dream Horizon that exposes
    Odin — Dream Sports' internal developer platform — to agents. It adapts 45 documented tools onto the
    odin-deployer REST and gRPC APIs, odin-scout REST, and the user-auth org/team/member REST API, with
    destructive operations gated behind a type_to_confirm argument. Protobuf service definitions for the
    gRPC surface are published in the odin-cli repo.
  humanURL: https://github.com/dream-horizon-org/odin-mcp
  tags:
  - MCP
  - agent-native
  - Developer Platform
  - DevOps
  - Open-Source
