- name: Checkmate Test Management API
  description: >-
    Checkmate is Dream Sports' open-source test case management application, published through Dream Horizon with a
    hosted reference instance at checkmate.dreamhorizon.org that also serves the OpenAPI document at /openapi.yaml.
    The API covers projects, test runs, test cases, sections, labels, squads, platforms, priorities, users and
    reporting, with cookie-session and bearer-token authentication.
  humanURL: https://checkmate.dreamhorizon.org/
  baseURL: https://checkmate.dreamhorizon.org/
  tags:
  - test-management
  - quality-assurance
  - developer-tools
  - open-source
  properties:
  - type: OpenAPI
    url: openapi/dream-sports-checkmate-openapi.yml
  - type: Documentation
    url: https://checkmate.dreamhorizon.org/
  - type: SourceCode
    url: https://github.com/dream-horizon-org/checkmate
  - type: Overlay
    url: overlays/dream-sports-checkmate-overlay.yaml
- name: Raven In-App Messaging & Journeys API
  description: >-
    Raven is Dream Sports' open-source in-app messaging, nudge and journey platform. The Raven Journey API models
    journeys, triggers, cohorts, templates, campaigns and analytics; the companion Raven Thunder services expose the
    client-facing app-launch/nudge-preview surface and an admin surface for behaviour tags, CTAs, nudges, snapshots
    and tenants. Requests are scoped by an x-tenant-id header.
  humanURL: https://raven.dreamhorizon.org/
  baseURL: https://raven.dreamhorizon.org/
  tags:
  - in-app-messaging
  - customer-engagement
  - journeys
  - mobile
  - open-source
  properties:
  - type: OpenAPI
    url: openapi/dream-sports-raven-journey-openapi.yml
  - type: OpenAPI
    url: openapi/dream-sports-thunder-api-openapi.yml
  - type: OpenAPI
    url: openapi/dream-sports-thunder-admin-openapi.yml
  - type: SourceCode
    url: https://github.com/dream-horizon-org/raven
  - type: Overlay
    url: overlays/dream-sports-raven-journey-overlay.yaml
- name: Delivr & DOTA Over-The-Air Update APIs
  description: >-
    Delivr is Dream Sports' open-source over-the-air mobile update and release platform (React Native, iOS, Android),
    with a self-hosted OTA server whose OpenAPI covers apps, deployments, releases, rollbacks, promotion, access keys,
    collaborators, metrics and update checks. DOTA is the companion CodePush-compatible OTA backend covering
    acquisition, management and authentication endpoints. Both are tenant-aware and use bearer or access-key auth.
  humanURL: https://www.delivr.live/
  baseURL: https://www.delivr.live/
  tags:
  - ota-updates
  - mobile
  - release-management
  - devops
  - open-source
  properties:
  - type: OpenAPI
    url: openapi/dream-sports-delivr-ota-openapi.yml
  - type: OpenAPI
    url: openapi/dream-sports-dota-openapi.yml
  - type: Documentation
    url: https://www.delivr.live/
  - type: SourceCode
    url: https://github.com/dream-horizon-org/delivr
  - type: CLI
    url: cli/dream-sports-cli.yml
  - type: Overlay
    url: overlays/dream-sports-delivr-ota-overlay.yaml
- name: Odin MCP Server
  description: >-
    First-party Model Context Protocol server (stdio transport) published by Dream Horizon that exposes Odin — Dream
    Sports' internal developer platform — to agents. It adapts 45 documented tools onto the odin-deployer REST and
    gRPC APIs, odin-scout REST, and the user-auth org/team/member REST API, with destructive operations gated behind
    a type_to_confirm argument. Protobuf service definitions for the gRPC surface are published in the odin-cli repo.
  humanURL: https://github.com/dream-horizon-org/odin-mcp
  tags:
  - mcp
  - agent-native
  - developer-platform
  - devops
  - open-source
  properties:
  - type: MCPServer
    url: mcp/dream-sports-mcp.yml
  - type: ToolCrosswalk
    url: mcp/dream-sports-tool-crosswalk.yml
  - type: Protobuf
    url: grpc/dream-sports-odin-od-service.proto
  - type: Protobuf
    url: grpc/dream-sports-odin-od-environment.proto
  - type: SourceCode
