apis:
- name: Guardian Authentication & Authorization API
  description: >-
    Guardian is Dream Sports' open-source authentication and authorization platform, released through Dream Horizon
    under the MIT license. It implements OAuth 2.0 (authorization code, implicit, client credentials) and OpenID
    Connect 1.0 with discovery, UserInfo and JWKS endpoints, plus PKCE, passwordless/OTP sign-in, username-password,
    social login (Google, Facebook), biometric challenge, guest login, session and refresh-token management, admin
    client and scope management, and multi-tenant isolation via a tenant-id header. The Dream11 production identity
    host auth.dream11.com serves an OpenID Connect discovery document whose endpoint set (/authorize, /token,
    /userinfo, /certs, token revocation) matches this specification; self-hosted deployments run on their own host.
  humanURL: https://guardianhq.io/docs/
  baseURL: https://auth.dream11.com/
  tags:
  - authentication
  - authorization
  - oauth2
  - openid-connect
  - identity
  - open-source
  properties:
  - type: OpenAPI
    url: openapi/dream-sports-guardian-openapi.yml
  - type: OpenAPI
    url: openapi/dream-sports-guardian-integrations-openapi.yml
  - type: Documentation
    url: https://guardianhq.io/docs/
  - type: SourceCode
